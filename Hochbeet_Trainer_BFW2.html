<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Hochbeet-Trainer – BBS 1 Delmenhorst</title>
<style>
:root{
  color-scheme: light;
  --bg:#f0f4f8; --surface:#ffffff; --card:#ffffff; --border:#c8d6e5;
  --accent:#1a4f8c; --accent2:#2874a6;
  --green:#1a7a4a; --red:#c0392b; --yellow:#b7770d;
  --text:#1c2833; --muted:#5d6d7e;
  --sans:Calibri,'Segoe UI',Arial,sans-serif; --mono:'JetBrains Mono','Consolas',monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#f0f4f8}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:#f0f4f8;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#1a4f8c 0%,#2874a6 100%);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
header img{height:38px;width:auto;border-radius:6px;background:#fff;padding:2px}
header h1{font-size:19px;font-weight:700;line-height:1.15}
header p{font-size:12.5px;color:#b8d4f0}
.tab-bar{display:flex;background:#e8eef5;border-bottom:2px solid #c8d6e5;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{flex:1;padding:13px 6px;text-align:center;font:600 15px var(--sans);color:var(--muted);background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:#f7fafd}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;box-shadow:0 1px 4px rgba(26,79,140,.07);padding:14px;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:99px;border:1px solid var(--border);background:#fff;font:600 14px var(--sans);color:var(--muted);cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-size:18px;color:var(--accent);margin-bottom:4px}
.lead{color:var(--muted);font-size:14.5px;margin-bottom:10px}
svg{display:block;width:100%;height:auto;max-height:260px;margin:4px auto 8px}
.slider{margin:12px 0}
.slider label{display:flex;justify-content:space-between;font-weight:600;font-size:15px}
.slider label span.v{font-family:var(--mono);color:var(--accent)}
input[type=range]{width:100%;height:36px;accent-color:#1a4f8c}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.res>div{background:#eef4fb;border:1px solid #c8d6e5;border-radius:10px;padding:8px 10px}
.res small{display:block;color:var(--muted);font-size:12px}
.res b{font-family:var(--mono);font-size:17px;color:var(--accent)}
.res .formula{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.info{background:#eef4fb;border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:14.5px;margin-top:10px}
.quest{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.quest p{font-weight:600;margin-bottom:6px;font-size:15px}
.btn{display:inline-block;padding:12px 18px;border-radius:10px;border:none;font:600 15px var(--sans);cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.reveal{display:none;margin-top:8px}
.reveal.show{display:block}
/* Check */
.progress{height:8px;background:#dbe6f2;border-radius:99px;overflow:hidden;margin:6px 0 12px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .3s}
.topic{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:#eef4fb;border:1px solid #c8d6e5;border-radius:99px;padding:2px 10px;margin-bottom:8px}
.qtext{font-size:16.5px;margin-bottom:12px}
.answer{display:flex;gap:8px;align-items:center}
.answer input{flex:1;min-width:0;font:600 20px var(--mono);padding:12px;border:2px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
.answer input:focus{border-color:var(--accent);outline:none}
.answer input.correct{border-color:var(--green);background:#eafaf1}
.answer input.wrong{border-color:var(--red);background:#fdedec}
.answer .unit{font-weight:600;color:var(--muted);min-width:44px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px;display:none}
.fb.show{display:block}
.fb.ok{background:#eafaf1;color:var(--green);border:1px solid #a9dfbf}
.fb.err{background:#fdedec;color:var(--red);border:1px solid #f5b7b1}
.fb.inf{background:#fef9e7;color:var(--yellow);border:1px solid #f9e79f}
.fb .sol{color:var(--text);margin-top:6px;font-size:14.5px}
.ampel{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.ampel:last-child{border:none}
.dot{width:22px;height:22px;border-radius:50%;flex:0 0 22px}
.dot.g{background:var(--green)}.dot.y{background:#e0a100}.dot.r{background:var(--red)}
.big{font:700 34px var(--mono);color:var(--accent);text-align:center}
.center{text-align:center}
.muted{color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:6px 14px 24px}
</style>
</head>

<header>

  <div><h1>Hochbeet-Trainer</h1><p>BBS 1 Delmenhorst · Mathematik BFW2 · LG1</p></div>
</header>
<nav class="tab-bar">
  <button class="tab active" data-tab="explore">🔍 Erkunden</button>
  <button class="tab" data-tab="check">✅ Check</button>

<main>
<section id="explore">
  <div class="chips">
    <button class="chip active" data-ex="L">L-Beet</button>
    <button class="chip" data-ex="P">Parallelogramm</button>
    <button class="chip" data-ex="Z">Regentonne</button>
  </div>
  <div id="exBody"></div>
</section>
<section id="check" hidden><div id="chBody"></div></section>
</main>
<footer>BBS 1 Delmenhorst · Handelslehranstalten · Mathematik BFW2 · 2026/27</footer>

<script>
const $=(s,r=document)=>r.querySelector(s);
const fmt=(x,d=2)=>{const r=Math.round(x*Math.pow(10,d))/Math.pow(10,d);return r.toLocaleString('de-DE',{maximumFractionDigits:d})};
/* ---------- Tabs ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));
  $('#explore').hidden=b.dataset.tab!=='explore'; $('#check').hidden=b.dataset.tab!=='check';
  window.scrollTo(0,0);
});
/* ---------- Erkunden ---------- */
function slider(id,label,min,max,step,val,unit){
  return `<div class="slider"><label for="${id}">${label}<span class="v" id="${id}v">${fmt(val,1)} ${unit}</span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
function reveal(q,a){return `<div class="quest"><p>${q}</p><button class="btn btn-ghost" onclick="this.nextElementSibling.classList.toggle('show')">Antwort zeigen</button><div class="reveal info">${a}</div></div>`}
const EX={
 L(){
  $('#exBody').innerHTML=`<div class="card"><h2>L-Beet mit Sitzecke</h2>
  <p class="lead">Verändere die Maße. Die Sitzecke (gestrichelt) gehört nicht zum Beet.</p>
  <div id="fig"></div>
  ${slider('L','Länge',3,8,0.5,5,'m')}${slider('B','Breite',3,6,0.5,4,'m')}${slider('s','Sitzecke: Breite',0.5,4,0.5,2,'m')}${slider('t','Sitzecke: Tiefe',0.5,3,0.5,2.5,'m')}
  <div class="res" id="res"></div>
  ${reveal('Was passiert mit dem <b>Umfang</b>, wenn du nur die Sitzecke veränderst?','Der Umfang bleibt gleich: <b>U = 2 · (Länge + Breite)</b>. Ein rechtwinklig herausgeschnittenes Eck macht den Rand nicht länger und nicht kürzer.')}
  ${reveal('Wie berechnest du die Beetfläche?','Ergänzen und abziehen: <b>A = Länge · Breite − Sitzecke</b>. Oder zerlegen in zwei Rechtecke, beide Wege liefern dasselbe Ergebnis.')}
  </div>`;
  const ids=['L','B','s','t'];
  function upd(){
   let L=+$('#L').value,B=+$('#B').value;
   $('#s').max=L-1; $('#t').max=B-1;
   let s=Math.min(+$('#s').value,L-1),t=Math.min(+$('#t').value,B-1);
   $('#s').value=s;$('#t').value=t;
   ids.forEach(i=>$('#'+i+'v').textContent=fmt(+$('#'+i).value,1)+' m');
   const A=L*B-s*t,U=2*(L+B),V=A*0.05*1000;
   const sc=Math.min(230/L,140/B),x0=45,y0=25,w=L*sc,h=B*sc,cw=s*sc,ch=t*sc;
   $('#fig').innerHTML=`<svg viewBox="0 0 320 210" role="img" aria-label="L-förmiges Beet"><polygon points="${x0},${y0+h} ${x0+w},${y0+h} ${x0+w},${y0+ch} ${x0+w-cw},${y0+ch} ${x0+w-cw},${y0} ${x0},${y0}" fill="#d5e3f0" stroke="#1a4f8c" stroke-width="2.5"/><rect x="${x0+w-cw}" y="${y0}" width="${cw}" height="${ch}" fill="#fff" stroke="#5d6d7e" stroke-dasharray="5 4"/><text x="${x0+(w-cw)/2}" y="${y0+h/2+4}" text-anchor="middle" fill="#1a4f8c" font-weight="700" font-size="14">Beet</text><text x="${x0+w-cw/2}" y="${y0+ch/2+4}" text-anchor="middle" fill="#5d6d7e" font-size="11">Sitzecke</text><text x="${x0+w/2}" y="${y0+h+18}" text-anchor="middle" font-size="13" fill="#1c2833">${fmt(L,1)} m</text><text x="${x0-8}" y="${y0+h/2}" text-anchor="end" font-size="13" fill="#1c2833">${fmt(B,1)} m</text></svg>`;
   $('#res').innerHTML=`<div><small>Beetfläche</small><b>${fmt(A,2)} m²</b><div class="formula">${fmt(L,1)}·${fmt(B,1)} − ${fmt(s,1)}·${fmt(t,1)}</div></div><div><small>Umfang (Zaun)</small><b>${fmt(U,1)} m</b><div class="formula">2·(${fmt(L,1)}+${fmt(B,1)})</div></div><div><small>Mulch, 5 cm hoch</small><b>${fmt(V,0)} l</b><div class="formula">${fmt(A,2)} m² · 0,05 m</div></div><div><small>Säcke à 50 l</small><b>${Math.ceil(V/50-1e-9)}</b><div class="formula">aufgerundet</div></div>`;
  }
  ids.forEach(i=>$('#'+i).oninput=upd); upd();
 },
 P(){
  $('#exBody').innerHTML=`<div class="card"><h2>Parallelogramm: Höhe oder Schrägseite?</h2>
  <p class="lead">Schiebe die obere Kante seitlich. Beobachte Fläche und Umfang.</p>
  <div id="fig"></div>
  ${slider('g','Grundseite g',2,10,0.5,6,'cm')}${slider('h','Höhe h',1,6,0.5,3,'cm')}${slider('o','Verschiebung oben',-3,3,0.5,1.5,'cm')}
  <div class="res" id="res"></div>
  ${reveal('Was bleibt gleich, wenn du nur die Verschiebung änderst? Was ändert sich?','Die <b>Fläche</b> bleibt gleich (g · h), denn Grundseite und Höhe ändern sich nicht. Der <b>Umfang</b> ändert sich, weil die Schrägseite länger oder kürzer wird.')}

   $('#res').innerHTML=`<div><small>Fläche</small><b>${fmt(g*h,2)} cm²</b><div class="formula">${fmt(g,1)}·${fmt(h,1)}</div></div><div><small>Umfang</small><b>${fmt(2*(g+s),2)} cm</b><div class="formula">2·(${fmt(g,1)}+${fmt(s,2)})</div></div><div><small>Schrägseite</small><b>${fmt(s,2)} cm</b></div><div><small>Falsch: g · Schrägseite</small><b>${fmt(g*s,2)} cm²</b><div class="formula">nicht die Fläche!</div></div>`;

 Z(){

const ri=(a,b,st=1)=>a+st*Math.floor(Math.random()*((b-a)/st+1));
const TOPICS=['Fläche & Umfang','Zusammengesetzte Flächen','Körper & Einheiten'];
const GEN=[
 ()=>{const a=ri(4,9),b=ri(2,4);return{t:0,q:`Ein Hochbeet ist ${a} m lang und ${b} m breit. Wie groß ist die <b>Fläche</b>?`,u:'m²',a:a*b,tip:'Rechteck: A = a · b',sol:`A = ${a} · ${b} = ${a*b} m²`}},
 ()=>{const a=ri(5,12),b=ri(3,7);return{t:0,q:`Um ein Beet (${a} m × ${b} m) soll ein Zaun. Wie viele Meter Zaun sind nötig (<b>Umfang</b>)?`,u:'m',a:2*(a+b),tip:'U = 2 · (a + b)',sol:`U = 2 · (${a} + ${b}) = ${2*(a+b)} m`}},
 ()=>{const g=ri(20,40,5),h=ri(10,20,5),s=h+ri(5,10,5);return{t:0,q:`Eine Wegplatte ist ein Parallelogramm: Grundseite ${g} cm, Höhe ${h} cm, Schrägseite ${s} cm. Wie groß ist die <b>Fläche</b>?`,u:'cm²',a:g*h,tip:'Nimm die Höhe, nicht die Schrägseite: A = g · h',sol:`A = ${g} · ${h} = ${g*h} cm²`}},
 ()=>{const g=ri(4,16,2),h=ri(3,9);return{t:0,q:`Ein Dreieck hat die Grundseite ${g} cm und die Höhe ${h} cm. Berechne die <b>Fläche</b>.`,u:'cm²',a:g*h/2,tip:'Dreieck: A = ½ · g · h',sol:`A = ½ · ${g} · ${h} = ${g*h/2} cm²`}},
 ()=>{const a=ri(6,10),c=ri(3,5),h=ri(2,4);return{t:0,q:`Ein Trapezbeet hat die parallelen Seiten ${a} m und ${c} m und den Abstand ${h} m. Wie groß ist die <b>Fläche</b>?`,u:'m²',a:(a+c)*h/2,tip:'Trapez: A = ½ · (a + c) · h',sol:`A = ½ · (${a} + ${c}) · ${h} = ${(a+c)*h/2} m²`}},
 ()=>{const L=ri(5,8),B=ri(4,6),s=ri(2,3),t=ri(1,3);return{t:1,q:`Ein L-förmiges Beet entsteht aus einem Rechteck ${L} m × ${B} m, aus dem eine Ecke von ${s} m × ${t} m als Sitzecke herausgenommen wird. Wie groß ist die <b>Beetfläche</b>?`,u:'m²',a:L*B-s*t,tip:'Ergänzen und abziehen: großes Rechteck minus Sitzecke',sol:`A = ${L} · ${B} − ${s} · ${t} = ${L*B} − ${s*t} = ${L*B-s*t} m²`}},
 ()=>{const w=ri(30,50,10),hw=ri(40,60,10),hg=ri(10,20,5);return{t:1,q:`Die Wand eines Insektenhotels ist ein Rechteck (${w} cm breit, ${hw} cm hoch) mit einem Dreieck als Giebel darüber (Grundseite ${w} cm, Höhe ${hg} cm). Wie groß ist die <b>Gesamtfläche</b>?`,u:'cm²',a:w*hw+w*hg/2,tip:'Rechteck + Dreieck (½ · g · h)',sol:`A = ${w} · ${hw} + ½ · ${w} · ${hg} = ${w*hw} + ${w*hg/2} = ${w*hw+w*hg/2} cm²`}},
 ()=>{const a=ri(4,8)*10,b=ri(3,6)*10,c=ri(2,4)*10;return{t:2,q:`Eine Kiste ist ${a} cm lang, ${b} cm breit und ${c} cm hoch. Wie viele <b>Liter</b> fasst sie?`,u:'l',a:a*b*c/1000,tip:'V = a · b · c in cm³, dann durch 1 000 teilen (1 l = 1 000 cm³)',sol:`V = ${a} · ${b} · ${c} = ${a*b*c} cm³ = ${a*b*c/1000} l`}},
 ()=>{const d=ri(4,8)*10,h=ri(5,10)*10,r=d/2,v=Math.PI*r*r*h/1000;return{t:2,q:`Eine Regentonne (Zylinder) hat den Durchmesser ${d} cm und die Höhe ${h} cm. Wie viele <b>Liter</b> fasst sie? (auf 1 l genau)`,u:'l',a:v,tolAbs:0.6,tip:`Radius = Durchmesser : 2 = ${r} cm. V = π · r² · h, dann durch 1 000 teilen.`,sol:`V = π · ${r}² · ${h} ≈ ${fmt(v*1000,0)} cm³ ≈ ${fmt(v,1)} l`}},
 ()=>{const m=ri(2,9)/2;return{t:2,q:`Rechne um: ${fmt(m,1)} m² = ? cm²`,u:'cm²',a:m*10000,tip:'1 m² = 10 000 cm²',sol:`${fmt(m,1)} · 10 000 = ${fmt(m*10000,0)} cm²`}}
];
let CH=null;
function newRound(){CH={qs:GEN.map(g=>Object.assign(g(),{tries:0,pts:null})),i:0,done:false};renderQ()}
function parse(s){let t=String(s).trim().replace(/\s/g,'');if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t))t=t.replace(/\./g,'');return parseFloat(t.replace(',','.'))}
function renderQ(){
  const c=CH,q=c.qs[c.i],box=$('#chBody');
  box.innerHTML=`<div class="card"><div class="muted">Aufgabe ${c.i+1} von ${c.qs.length}</div><div class="progress"><div style="width:${c.i/c.qs.length*100}%"></div></div>
  <span class="topic">${TOPICS[q.t]}</span><div class="qtext">${q.q}</div>
  <div class="answer"><input id="ans" type="text" inputmode="decimal" autocomplete="off" placeholder="Ergebnis" aria-label="Ergebnis"><span class="unit">${q.u}</span></div>
  <div class="fb" id="fb"></div>
  <div class="btn-row"><button class="btn btn-primary" id="chk">Prüfen</button><button class="btn btn-primary" id="nxt" style="display:none">${c.i===c.qs.length-1?'Ergebnis ansehen':'Weiter'}</button></div></div>`;
  const inp=$('#ans'); $('#chk').onclick=check; inp.onkeydown=e=>{if(e.key==='Enter'){$('#nxt').style.display!=='none'?next():check()}};
  $('#nxt').onclick=next; inp.focus({preventScroll:true});
}
function check(){
  const q=CH.qs[CH.i],inp=$('#ans'),fb=$('#fb');
  const v=parse(inp.value);
  if(isNaN(v)){fb.className='fb show inf';fb.textContent='Bitte gib eine Zahl ein.';return}
  const ok=q.tolAbs!==undefined?Math.abs(v-q.a)<=q.tolAbs:Math.abs(v-q.a)<=Math.abs(q.a)*0.001;
  q.tries++;
  if(ok){q.pts=q.tries===1?2:1;inp.className='correct';inp.disabled=true;fb.className='fb show ok';fb.innerHTML=`<b>Richtig!</b> ${q.tries===1?'':'(im zweiten Versuch)'}<div class="sol">${q.sol}</div>`;endQ()}
  else if(q.tries===1){inp.className='wrong';fb.className='fb show err';fb.innerHTML=`<b>Noch nicht ganz.</b> Tipp: ${q.tip}<div class="sol">Versuche es noch einmal.</div>`;inp.select()}
  else{q.pts=0;inp.className='wrong';inp.disabled=true;fb.className='fb show err';fb.innerHTML=`<b>Das war leider falsch.</b><div class="sol">Lösung: ${q.sol}</div>`;endQ()}
}
function endQ(){$('#chk').style.display='none';$('#nxt').style.display='inline-block';$('#nxt').focus({preventScroll:true})}
function next(){CH.i++;CH.i>=CH.qs.length?result():renderQ()}
function result(){
  const per=TOPICS.map((n,ti)=>{const qs=CH.qs.filter(q=>q.t===ti),got=qs.reduce((a,q)=>a+q.pts,0),max=qs.length*2,p=got/max;return{n,got,max,p,c:p>=0.8?'g':p>=0.5?'y':'r'}});
  const tot=CH.qs.reduce((a,q)=>a+q.pts,0),max=CH.qs.length*2;
  const txt={g:'Grün: sicher',y:'Gelb: fast',r:'Rot: noch üben'};
  $('#chBody').innerHTML=`<div class="card"><h2 class="center">Deine Ampel</h2><div class="big">${tot} / ${max}</div><p class="center muted">Punkte (2 im ersten, 1 im zweiten Versuch)</p><div style="margin-top:10px">
  ${per.map(p=>`<div class="ampel"><span class="dot ${p.c}"></span><div><b>${p.n}</b><div class="muted">${p.got} von ${p.max} Punkten · ${txt[p.c]}</div></div></div>`).join('')}</div>
  <div class="info">Trage die Ampel auf deinem Arbeitsblatt ein (Teil A) und notiere eine Frage für das Gespräch.</div>
  <div class="btn-row"><button class="btn btn-primary" id="again">Neue Runde</button><button class="btn btn-ghost" id="rev">Fehler ansehen</button></div><div id="rv"></div></div>`;
  $('#again').onclick=newRound;
  $('#rev').onclick=()=>{$('#rv').innerHTML=CH.qs.filter(q=>q.pts<2).map(q=>`<div class="quest"><p>${q.q}</p><div class="info">${q.sol}</div></div>`).join('')||'<div class="info" style="margin-top:10px">Alles im ersten Versuch richtig. Stark!</div>'};
}
newRound();
</script>
